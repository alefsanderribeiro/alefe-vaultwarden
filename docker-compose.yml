services:
  vaultwarden:
    container_name: vaultwarden_server
    image: vaultwarden/server:latest
    dns:
      - 8.8.8.8
      - 1.1.1.1
    env_file: .env
    volumes:
      - ./vw-data:/data/
    networks:
      - edge
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

# O Caddy NÃO mora mais aqui. Foi promovido a projeto de infraestrutura
# próprio em ~/caddy, para deixar de ser um ponto único de falha acoplado
# a este serviço (recriar o Vaultwarden derrubava a borda inteira).
#
# O Caddyfile, o build e os certificados vivem lá. Este projeto cuida
# apenas do Vaultwarden.

networks:
  # Rede de borda criada uma vez por host, FORA de qualquer compose:
  #   docker network create edge
  # Por ser externa, nenhum `docker compose down` consegue removê-la —
  # antes, esta rede pertencia a este projeto e um `down` aqui deixava
  # 6 outros projetos sem rede.
  edge:
    external: true
    name: edge
